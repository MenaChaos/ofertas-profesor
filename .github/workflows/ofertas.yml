name: Ofertas del Profesor

on:
  schedule:
    # Se ejecuta a las 23:35 UTC (19:35 hora Chile UTC-4)
    - cron: '35 23 * * *'
  workflow_dispatch: # Permite seguir probando manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python_version: '3.9'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar script del Profesor
        env:
          WEBHOOK_PROFESOR: ${{ secrets.WEBHOOK_PROFESOR }}
        run: python ofertas.py

      - name: Guardar bitácora de experimentos
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add historial.txt
          git commit -m "🧪 Bitácora actualizada: $(date +'%Y-%m-%d')" || exit 0
          git push
