name: Ofertas del Profesor

on:
  schedule:
    # 00:40 UTC es 20:40 en Chile (UTC-4)
    - cron: '40 0 * * *'
  workflow_dispatch: # Esto te permite seguir probándolo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar librerías
        run: pip install requests deep-translator

      - name: Ejecutar script del Profesor
        env:
          WEBHOOK_PROFESOR: ${{ secrets.WEBHOOK_PROFESOR }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ofertas.py
